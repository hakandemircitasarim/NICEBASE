// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
    
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }

        // Capacitor plugin modules never set Kotlin's jvmTarget, so it follows
        // the JDK running Gradle (21 under Android Studio's JBR) while the Java
        // target above stays 17. Release builds abort on that mismatch:
        //   "Inconsistent JVM-target compatibility detected for tasks
        //    compileReleaseJavaWithJavac (17) and compileReleaseKotlin (21)"
        // Pin Kotlin to the same 17 so both toolchains agree. Matched by task
        // name rather than KotlinCompile.class, because the Kotlin plugin is
        // not on the root project's buildscript classpath.
        project.tasks.matching { it.name ==~ /compile.*Kotlin/ }.configureEach {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
